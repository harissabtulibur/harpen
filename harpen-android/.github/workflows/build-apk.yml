name: Build HARPEN Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'APK Build Variant'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Android project directory
        id: project-dir
        run: |
          if [ -f "settings.gradle.kts" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "harpen-android/settings.gradle.kts" ]; then
            echo "dir=harpen-android" >> "$GITHUB_OUTPUT"
          else
            echo "Could not find settings.gradle.kts." >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run Unit Tests
        working-directory: ${{ steps.project-dir.outputs.dir }}
        run: gradle testDebugUnitTest --no-daemon

      - name: Build Debug APK
        if: ${{ inputs.build_type != 'release' }}
        working-directory: ${{ steps.project-dir.outputs.dir }}
        run: gradle assembleDebug --no-daemon

      - name: Build Release APK (Unsigned)
        if: ${{ inputs.build_type == 'release' }}
        working-directory: ${{ steps.project-dir.outputs.dir }}
        run: gradle assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: harpen-android-${{ inputs.build_type || 'debug' }}-apk
          path: ${{ steps.project-dir.outputs.dir }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
